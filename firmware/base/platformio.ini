; Claude body -- BASE firmware ("spinal cord")
; Build:  ~/.platformio/penv/bin/pio run -e base
; Tests:  ~/.platformio/penv/bin/pio test -e native
; DO NOT run `pio run -t upload` without checking which board is on which port
; (see ../README.md, "Flashing safely").

[platformio]
default_envs = base

[common]
lib_deps_core =
    bblanchon/ArduinoJson@7.4.3

[env:base]
; pioarduino platform = Arduino-ESP32 core 3.3.9 / ESP-IDF 5.5 (pinned).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-DevKitC-1 N8R2: 8 MB quad flash, 2 MB quad PSRAM
; (same settings as the platform's esp32-s3-devkitc1-n8r2 board file).
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -Wall
lib_deps =
    ${common.lib_deps_core}
    ftservo/FTServo@2.0.0
    pololu/VL53L1X@1.3.1
    adafruit/Adafruit NeoPixel@1.15.4
    adafruit/Adafruit BNO08x@1.2.7

; Same firmware with an MPU-6050 instead of the BNO085.
[env:base_mpu6050]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DIMU_MPU6050
lib_deps =
    ${common.lib_deps_core}
    ftservo/FTServo@2.0.0
    pololu/VL53L1X@1.3.1
    adafruit/Adafruit NeoPixel@1.15.4

; BENCH build for the wheels-off-the-ground bring-up: the robot sits on a
; stand, so the down sensors see the bench far below. Widens the floor
; calibration window to 250 mm. NEVER leave this on the robot for floor use:
; it reports fw "base 0.1.0 bench" in `hello` so the Pi can refuse to drive.
[env:base_bench]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DBENCH_BUILD
    -DCAL_MAX_MM=250

; Host-side unit tests of the hardware-free logic in lib/core.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
lib_deps =
    ${common.lib_deps_core}
