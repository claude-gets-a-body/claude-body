; Claude body -- FACE firmware (eyes, visor, ears, touch)
; Build:  ~/.platformio/penv/bin/pio run -e face
; Tests:  ~/.platformio/penv/bin/pio test -e native
; DO NOT run `pio run -t upload` without checking which board is on which port
; (see ../README.md, "Flashing safely").

[platformio]
default_envs = face

[common]
lib_deps_core =
    bblanchon/ArduinoJson@7.4.3

[env:face]
; pioarduino platform = Arduino-ESP32 core 3.3.9 / ESP-IDF 5.5 (pinned).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-DevKitC-1 N8R2: 8 MB quad flash, 2 MB quad PSRAM
; (same settings as the platform's esp32-s3-devkitc1-n8r2 board file).
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -Wall
lib_deps =
    ${common.lib_deps_core}
    lovyan03/LovyanGFX@1.2.32
    pololu/VL53L1X@1.3.1

; Host-side unit tests of the hardware-free logic in lib/core.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
lib_deps =
    ${common.lib_deps_core}
